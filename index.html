<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenHouse | Sensor Log</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header with branding/title and active queue count -->
    <header class="portal-header">
      <div class="header-content">
        <div class="brand">
          <span class="brand-icon">&#129716;</span>
          <h1>GreenHouse <span class="brand-sub"> Sensor Log</span></h1>
        </div>
        <div class="header-status">
          Active Queue: <span id="queue-count" class="badge-count">0</span>
        </div>
      </div>
    </header>

    <!-- the main section with 2 containers: input and output -->
    <main class="portal-container">
      <aside class="panel form-panel">
        <h2 class="panel-title">Record Sensor Data</h2>
        <!-- hidden element which fires if user gives out of bounds input -->
        <div
          id="form-error-banner"
          class="alert alert-danger hidden"
          role="alert"
        ></div>
        <!-- form input -->
        <form action="#" id="sensor-form" novalidate>
          <div class="form-group">
            <label for="plant-name" class="form-label"
              >Sensor Name <span class="required">*</span></label
            >
            <input
              type="text"
              name="plant-name"
              id="plant-name"
              class="form-control"
              placeholder="e.g. Marigold"
              required
            />
          </div>
          <div class="form-group">
            <label for="ph" class="form-label"
              >pH <span class="required">*</span></label
            >
            <input
              type="number"
              name="ph"
              id="ph"
              class="form-control"
              min="0.0"
              max="14.0"
              step="0.1"
              placeholder="6.0"
              required
            />
          </div>
          <div class="form-group">
            <label for="conductivity" class="form-label"
              >Electrical Conductivity (mS/cm)
              <span class="required">*</span></label
            >
            <input
              type="number"
              name="conductivity"
              id="conductivity"
              class="form-control"
              min="0"
              max="3"
              step="0.1"
              placeholder="2.5"
              required
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="temp" class="form-label"
                >Air Temperature (F) <span class="required">*</span></label
              >
              <input
                type="number"
                name="temp"
                id="temp"
                class="form-control"
                min="50.0"
                max="90.0"
                step="1.0"
                placeholder="72"
                required
              />
            </div>
            <div class="form-group">
              <label for="spo2" class="form-label"
                >SpO2 (%) <span class="required">*</span></label
              >
              <input
                type="number"
                name="spo2"
                id="spo2"
                class="form-control"
                min="50"
                max="100"
                placeholder="98"
                required
              />
            </div>
          </div>

          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Log Sensor Record
          </button>
        </form>
      </aside>

      <!-- Right container for output : DYNAMIC CONTENT injection -->
      <div class="record-info-container">
        <div class="overview-container">
          <article class="status-total-card">
            <h3 class="card-title overview-title">Optimal:</h3>
            <p class="status-total">0</p>
          </article>
          <article class="status-total-card">
            <h3 class="card-title overview-title">Warning:</h3>
            <span class="status-total">0</span>
          </article>
          <article class="status-total-card">
            <h3 class="card-title overview-title">Critical Hazard:</h3>
            <p class="status-total">0</p>
          </article>
        </div>

        <section class="panel records-panel">
          <div class="records-header">
            <h2 class="panel-title">Triage Queue</h2>
            <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
              Purge Queue
            </button>
          </div>

          <!-- create two states: 1. initial loading  2.state after the user interacts -->
          <div id="empty-state" class="empty-state">
            <span class="empty-icon">📋</span>
            <p>No active triage records logged.</p>
          </div>

          <ul id="records-list" class="records-grid" aria-live="polite"></ul>
        </section>
      </div>
    </main>

    <footer class="portal-footer">
      <p>&copy; 2026 CSI 3150 Greenhouse Sensor Logger F2026.</p>
    </footer>

    <!-- integrate js file here before body closing tag -->
    <script src="app.js"></script>
  </body>
</html>
